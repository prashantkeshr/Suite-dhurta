name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check and build (postbuild writes sitemap.xml, robots.txt, 404.html)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Safety net: if the repository's Pages source is ever "Deploy from a branch",
      # GitHub also publishes the raw, unbuilt source for this commit. Wait for that
      # legacy job to finish so this built site is always the one left live.
      - name: Wait for any legacy Pages branch build of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            runs=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}"               --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment")]')
            total=$(echo "$runs" | jq 'length')
            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then echo "Legacy build finished; deploying after it."; exit 0; fi
            if [ "$total" -eq 0 ] && [ "$i" -ge 6 ]; then echo "No legacy branch build for this commit."; exit 0; fi
            sleep 10
          done
          echo "::warning::Legacy Pages build still running after 5 minutes; deploying anyway."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    # Tell IndexNow search engines (Bing, Yandex, Seznam, Naver) about the new deploy.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Submit URLs to IndexNow
        run: node scripts/indexnow.mjs
