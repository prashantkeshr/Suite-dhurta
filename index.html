<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- seo:start — replaced per page at build time by scripts/postbuild.ts -->
    <title>Dhurta Suite — Private, in-browser productivity tools</title>
    <meta name="description" content="Image, PDF, text, data and developer tools that run entirely in your browser. No upload, no account, no server processing." />
    <!-- seo:end -->
    <meta name="theme-color" content="#0f1115" />
    <meta name="color-scheme" content="light dark" />
    <!-- Brand icons are generated from logo/ by scripts/brand.mjs -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="Suite" />
    <meta name="application-name" content="Dhurta Suite" />
    <meta name="msapplication-TileColor" content="#030c25" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Apply theme before first paint to avoid a flash of the wrong theme.
      try {
        var s = JSON.parse(localStorage.getItem('ds-theme') || '"system"');
        var dark = s === 'dark' || (s === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Dhurta Suite needs JavaScript because every tool runs inside your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
