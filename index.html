<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dhurta Suite — Private, in-browser productivity tools</title>
    <meta name="description" content="Image, PDF, text, data and developer tools that run entirely in your browser. No upload, no account, no server processing." />
    <meta property="og:title" content="Dhurta Suite" />
    <meta property="og:description" content="Private, in-browser productivity tools. Your files never leave your device." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0f1115" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply theme before first paint to avoid a flash of the wrong theme.
      try {
        var s = JSON.parse(localStorage.getItem('ds-theme') || '"system"');
        var dark = s === 'dark' || (s === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Dhurta Suite needs JavaScript because every tool runs inside your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
